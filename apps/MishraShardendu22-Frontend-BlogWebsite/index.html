    <!-- Theme initialization script - prevents FOUC (Flash of Unstyled Content) -->
    <script>
      (function() {
        try {
          // Migrate old theme keys to new shared key for backward compatibility
          const oldBlogTheme = localStorage.getItem('blog-theme');
          const oldTheme = localStorage.getItem('theme');
          const sharedTheme = localStorage.getItem('portfolio-theme');
          
          if (!sharedTheme && (oldBlogTheme || oldTheme)) {
            const migratedTheme = oldBlogTheme || oldTheme;
            localStorage.setItem('portfolio-theme', migratedTheme);
            // Clean up old keys
            localStorage.removeItem('blog-theme');
            localStorage.removeItem('theme');
          }
          
          // Use shared theme key across all portfolio websites for synchronized theme
          const theme = localStorage.getItem('portfolio-theme') || 
            (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          
          const root = document.documentElement;
          
          if (theme === 'dark') {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }
          
          // Apply immediate background to prevent white flash
          root.style.backgroundColor = theme === 'dark' ? '#000000' : '#fef7f0';
          root.style.color = theme === 'dark' ? '#ffffff' : '#1c1c1e';
          
          // Set theme-color meta tag
          const metaThemeColor = document.querySelector('meta[name="theme-color"]');
          if (metaThemeColor) {
            metaThemeColor.setAttribute('content', theme === 'dark' ? '#000000' : '#fef7f0');
          }
        } catch (e) {
          // Fallback to light theme
          document.documentElement.style.backgroundColor = '#fef7f0';
          document.documentElement.style.color = '#1c1c1e';
        }
      })();
    </script>
